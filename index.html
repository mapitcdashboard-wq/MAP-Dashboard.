<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>South Zone — WD Performance Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>

  :root{
    --ink:#14161c; --panel:#1c1f27; --panel-2:#22252f; --rule:#2d313d;
    --text-hi:#edeef1; --text-mid:#aab0bd; --text-lo:#767c8a;
    --gold:#c9a227; --amber:#d9a441; --teal:#4f9d8d; --coral:#d9694f;
    --coral-dim:#5c3a30; --teal-dim:#25423c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text-hi);font-family:'Inter',sans-serif;min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:28px 24px 60px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
  h1{font-family:'Zilla Slab',serif;font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em;}
  .sub{color:var(--text-mid);font-size:13.5px;margin-top:8px;max-width:480px;line-height:1.5;}
  #gate{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .gate-card{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--gold);padding:40px 36px;max-width:420px;width:100%;}
  .gate-mark{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:14px;}
  .gate-card h1{font-size:24px;text-align:center;}
  .gate-card .sub{margin:10px auto 24px;text-align:center;}
  .code-input{width:100%;background:var(--panel-2);border:1px solid var(--rule);color:var(--text-hi);padding:13px 16px;font-size:16px;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;text-align:center;text-transform:uppercase;border-radius:2px;margin-bottom:12px;}
  .code-input:focus{outline:1px solid var(--gold);}
  .go-btn{width:100%;background:var(--gold);color:#1a1a1a;border:none;padding:13px 16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;cursor:pointer;border-radius:2px;}
  .go-btn:hover{background:#dbb642;}
  .gate-error{color:var(--coral);font-size:12.5px;margin-top:12px;display:none;}
  .gate-error.show{display:block;}
  #dashboard{display:none;}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0;}
  .stat-card{background:var(--panel);border:1px solid var(--rule);padding:16px 18px;flex:1;min-width:140px;border-radius:2px;}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-mid);text-transform:uppercase;letter-spacing:.05em;}
  .stat-val{font-family:'Zilla Slab',serif;font-size:26px;font-weight:600;margin-top:4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--rule);}
  th{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10.5px;color:var(--text-mid);letter-spacing:.05em;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-family:'IBM Plex Mono',monospace;background:var(--panel-2);}
  .good{color:var(--teal);} .bad{color:var(--coral);}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate">
    <div class="gate-card">
      <div class="gate-mark">South Zone</div>
      <h1>WD Performance Portal</h1>
      <div class="sub">Enter your access code to view your performance.</div>
      <input type="text" id="codeInput" class="code-input" placeholder="ACCESS CODE">
      <button class="go-btn" onclick="viewDashboard()">View My Dashboard</button>
      <div class="gate-error" id="gateError">Invalid code. Please check and try again.</div>
    </div>
  </div>

  <div id="dashboard">
    <div class="eyebrow">South Zone</div>
    <h1 id="wdName">—</h1>
    <div class="sub" id="wdMeta">—</div>
    <div class="stat-row" id="statRow"></div>
    <table id="dataTable"><tbody></tbody></table>
  </div>
</div>

<script>
  // Credentials come from config.js — edit that file, not this one.
  const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  async function viewDashboard(){
    const code = document.getElementById('codeInput').value.trim();
    const errEl = document.getElementById('gateError');
    errEl.classList.remove('show');
    if (!code){ return; }

    const { data, error } = await sb.rpc('get_wd_dashboard', { p_login_code: code });
    if (error || !data || data.length === 0){
      errEl.classList.add('show');
      return;
    }

    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('wdName').textContent = data[0].wd_name;
    document.getElementById('wdMeta').textContent = `${data[0].branch} · ${data[0].city || ''} · Period ${data[0].period}`;

    const avgAch = data.reduce((s,r) => s + (Number(r.ach)||0) / (Number(r.target)||1) * 100, 0) / data.length;
    document.getElementById('statRow').innerHTML = `
      <div class="stat-card"><div class="stat-label">Metrics Tracked</div><div class="stat-val">${data.length}</div></div>
      <div class="stat-card"><div class="stat-label">Avg % of Target</div><div class="stat-val">${avgAch.toFixed(0)}%</div></div>
    `;

    let rows = '<tr><th>Category</th><th>Channel</th><th>Metric</th><th>Ach</th><th>Target</th><th>% of Target</th></tr>';
    data.forEach(r => {
      const pct = (Number(r.target) ? (Number(r.ach)/Number(r.target)*100) : 0);
      const cls = pct >= 100 ? 'good' : 'bad';
      rows += `<tr><td>${r.category||''}</td><td><span class="pill">${r.channel}</span></td><td>${r.metric}</td><td>${r.ach}</td><td>${r.target}</td><td class="${cls}">${pct.toFixed(0)}%</td></tr>`;
    });
    document.getElementById('dataTable').innerHTML = rows;
  }

  document.getElementById('codeInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') viewDashboard();
  });
</script>
</body>
</html>
