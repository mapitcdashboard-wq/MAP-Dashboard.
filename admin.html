<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WD Portal — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<style>

  :root{
    --ink:#14161c; --panel:#1c1f27; --panel-2:#22252f; --rule:#2d313d;
    --text-hi:#edeef1; --text-mid:#aab0bd; --text-lo:#767c8a;
    --gold:#c9a227; --amber:#d9a441; --teal:#4f9d8d; --coral:#d9694f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text-hi);font-family:'Inter',sans-serif;min-height:100vh;}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 24px 60px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
  h1{font-family:'Zilla Slab',serif;font-weight:700;font-size:28px;margin:0 0 4px;}
  .sub{color:var(--text-mid);font-size:13.5px;margin-bottom:24px;}
  .card{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--gold);padding:24px;margin-bottom:20px;border-radius:2px;}
  label{display:block;font-size:12px;color:var(--text-mid);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;font-family:'IBM Plex Mono',monospace;}
  input[type=email],input[type=password],input[type=text],input[type=file]{
    width:100%;background:var(--panel-2);border:1px solid var(--rule);color:var(--text-hi);
    padding:11px 14px;font-size:14px;border-radius:2px;margin-bottom:14px;font-family:'Inter',sans-serif;
  }
  button{background:var(--gold);color:#1a1a1a;border:none;padding:11px 20px;font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;cursor:pointer;border-radius:2px;}
  button:hover{background:#dbb642;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.secondary{background:transparent;border:1px solid var(--rule);color:var(--text-hi);}
  .msg{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:2px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:#1c3a30;color:#7fd9ae;border:1px solid #2d5c48;}
  .msg.err{background:#3a1c1c;color:#e08787;border:1px solid #5c2d2d;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:14px;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);}
  th{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:10.5px;color:var(--text-mid);letter-spacing:.05em;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-family:'IBM Plex Mono',monospace;background:var(--panel-2);color:var(--teal);}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .rowflex{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  select{background:var(--panel-2);border:1px solid var(--rule);color:var(--text-hi);padding:9px 12px;border-radius:2px;font-size:13px;}
  .hint{font-size:12px;color:var(--text-lo);margin-top:6px;line-height:1.5;}
  #app{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginScreen" style="max-width:400px;margin:60px auto;">
    <div class="eyebrow">South Zone WD Portal</div>
    <h1>Admin Login</h1>
    <div class="card">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@company.com">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
      <button onclick="doLogin()">Log In</button>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="topbar">
      <div>
        <div class="eyebrow">South Zone WD Portal</div>
        <h1>Admin Panel</h1>
        <div class="sub" id="whoami"></div>
      </div>
      <button class="secondary" onclick="doLogout()">Log Out</button>
    </div>

    <div class="card">
      <div class="eyebrow" style="margin-bottom:14px;">Upload Data</div>
      <label>CSV file (columns: branch, code, wd, city, level, category, channel, metric, ach, target)</label>
      <input type="file" id="csvFile" accept=".csv">
      <label>Period (e.g. 2026-08)</label>
      <input type="text" id="periodInput" placeholder="2026-08">
      <div class="rowflex">
        <button onclick="previewCsv()">Preview</button>
        <button onclick="uploadCsv()" id="uploadBtn" disabled>Confirm & Upload</button>
      </div>
      <div class="hint">Branch managers can only upload rows for their own assigned branch — rows for other branches will be rejected by the database.</div>
      <div id="uploadMsg" class="msg"></div>
      <div id="previewArea"></div>
    </div>

    <div class="card">
      <div class="eyebrow" style="margin-bottom:14px;">Generate WD Login Code</div>
      <div class="rowflex">
        <input type="text" id="newWdCode" placeholder="WD code e.g. HY4352" style="max-width:220px;margin-bottom:0;">
        <input type="text" id="newLoginCode" placeholder="Login code to give the WD" style="max-width:220px;margin-bottom:0;">
        <button onclick="createLoginCode()">Create</button>
      </div>
      <div id="codeMsg" class="msg"></div>
    </div>

    <div class="card">
      <div class="topbar" style="margin-bottom:0;">
        <div class="eyebrow">Current Data</div>
        <select id="periodFilter" onchange="loadData()"></select>
      </div>
      <div id="dataTable">Loading…</div>
    </div>
  </div>
</div>

<script>
  // Credentials come from config.js — edit that file, not this one.
  const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  let profile = null;
  let parsedRows = [];

  function showMsg(id, text, ok){
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'ok' : 'err');
  }

  async function doLogin(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error){ showMsg('loginMsg', error.message, false); return; }
    await loadProfileAndApp();
  }

  async function doLogout(){
    await sb.auth.signOut();
    location.reload();
  }

  async function loadProfileAndApp(){
    const { data: { user } } = await sb.auth.getUser();
    if (!user){ return; }
    const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
    if (error || !data){
      showMsg('loginMsg', 'No profile found for this account. Ask your admin to set one up.', false);
      return;
    }
    profile = data;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('whoami').textContent =
      profile.role === 'super_admin' ? 'Super Admin — all branches' : ('Branch Manager — ' + profile.branch);
    loadData();
  }

  document.getElementById('csvFile').addEventListener('change', () => {
    document.getElementById('previewArea').innerHTML = '';
    document.getElementById('uploadBtn').disabled = true;
  });

  function previewCsv(){
    const file = document.getElementById('csvFile').files[0];
    if (!file){ showMsg('uploadMsg', 'Choose a CSV file first.', false); return; }
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        parsedRows = results.data;
        const preview = parsedRows.slice(0, 8);
        let html = '<table><tr>' + Object.keys(preview[0] || {}).map(k => `<th>${k}</th>`).join('') + '</tr>';
        preview.forEach(r => {
          html += '<tr>' + Object.values(r).map(v => `<td>${v}</td>`).join('') + '</tr>';
        });
        html += '</table><div class="hint">' + parsedRows.length + ' rows found. Showing first 8.</div>';
        document.getElementById('previewArea').innerHTML = html;
        document.getElementById('uploadBtn').disabled = false;
      }
    });
  }

  async function uploadCsv(){
    const period = document.getElementById('periodInput').value.trim() || new Date().toISOString().slice(0,7);
    const rows = parsedRows.map(r => ({
      branch: r.branch, wd_code: r.code, wd_name: r.wd, city: r.city,
      level: r.level, category: r.value || r.category, channel: r.channel,
      metric: r.metric, ach: parseFloat(r.ach), target: parseFloat(r.target),
      period
    }));
    const { error } = await sb.from('wd_performance').insert(rows);
    if (error){ showMsg('uploadMsg', 'Upload failed: ' + error.message, false); return; }
    showMsg('uploadMsg', `Uploaded ${rows.length} rows for period ${period}.`, true);
    document.getElementById('uploadBtn').disabled = true;
    loadData();
  }

  async function createLoginCode(){
    const wd_code = document.getElementById('newWdCode').value.trim();
    const login_code = document.getElementById('newLoginCode').value.trim();
    if (!wd_code || !login_code){ showMsg('codeMsg', 'Fill in both fields.', false); return; }
    const branch = profile.role === 'super_admin' ? (prompt('Branch code for this WD?') || '') : profile.branch;
    const { error } = await sb.from('wd_login_codes').insert({ wd_code, login_code, branch });
    if (error){ showMsg('codeMsg', error.message, false); return; }
    showMsg('codeMsg', `Login code "${login_code}" created for ${wd_code}.`, true);
  }

  async function loadData(){
    let query = sb.from('wd_performance').select('*').order('uploaded_at', { ascending: false }).limit(200);
    const { data, error } = await query;
    if (error){ document.getElementById('dataTable').textContent = 'Error loading data: ' + error.message; return; }

    const periods = [...new Set(data.map(r => r.period))];
    const sel = document.getElementById('periodFilter');
    if (sel.options.length === 0){
      sel.innerHTML = '<option value="">All periods</option>' + periods.map(p => `<option value="${p}">${p}</option>`).join('');
    }
    const filterVal = sel.value;
    const rows = filterVal ? data.filter(r => r.period === filterVal) : data;

    let html = '<table><tr><th>Branch</th><th>WD Code</th><th>WD Name</th><th>Category</th><th>Channel</th><th>Metric</th><th>Ach</th><th>Target</th><th>Period</th></tr>';
    rows.slice(0, 100).forEach(r => {
      html += `<tr><td>${r.branch}</td><td>${r.wd_code}</td><td>${r.wd_name}</td><td>${r.category||''}</td><td><span class="pill">${r.channel}</span></td><td>${r.metric}</td><td>${r.ach}</td><td>${r.target}</td><td>${r.period}</td></tr>`;
    });
    html += '</table><div class="hint">Showing ' + Math.min(rows.length,100) + ' of ' + rows.length + ' rows.</div>';
    document.getElementById('dataTable').innerHTML = html;
  }

  // auto-login if session exists
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) loadProfileAndApp();
  });
</script>
</body>
</html>
